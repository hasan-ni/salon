# Render Blueprint: one web service runs the API, the live board and the website.
services:
  - type: web
    name: maison-lilac
    runtime: node
    plan: free            # change to starter to keep it awake all day
    buildCommand: npm install --prefix client --include=dev && npm run build --prefix client && npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true       # Render makes a long random secret for you
      - key: MONGODB_URI
        sync: false               # you paste your Atlas connection string
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SALON_TZ
        sync: false               # the salon's timezone, for example Indian/Maldives or Europe/London
      - key: SHOW_DEV_CODE
        value: "true"             # demo only: shows sign-in codes on screen. Remove once SMS works.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
